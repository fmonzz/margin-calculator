name: Build and Deploy

on:
  push:
    branches:
      - main  # Cambia se usi un altro branch principale

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (se usi Node)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build  # Cambia con il tuo comando build

      - name: Upload artifact (per GitHub Pages o altro deploy)
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ./dist  # o ./build, dipende dal tuo progetto

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
